<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SortMedication wireframe: sign up</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#000;background:#fff}
a{color:#000}a:hover{color:#000}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 20px;border:2px solid #000;background:#000;color:#fff;font:inherit;font-weight:600;text-decoration:none;box-sizing:border-box;cursor:pointer}
label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
input,select{box-sizing:border-box;width:100%;height:44px;border:1px solid #777;border-radius:0;padding:0 12px;font:inherit;background:#fff;color:#000}
</style>
</head>
<body>
<div style="background: #f7f7f7; min-height: 900px">
<header style="border-bottom: 1px solid #000; background: #fff">
<div style="max-width: 1200px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<a href="home.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 700; font-size: 18px"><span aria-hidden="true" style="width: 32px; height: 32px; background: #000; display: inline-block"></span>SortMedication</a>
<span style="font-size: 15px">Already have an account? <a href="#">Sign in</a></span>
</div>
</header>
<main style="padding: 56px 16px; display: flex; justify-content: center">
<form style="width: 100%; max-width: 460px; background: #fff; border: 1px solid #000; padding: 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
<h1 style="margin: 0; font-size: 28px">Start your 14-day free trial</h1>
<p style="margin: 0; color: #555; line-height: 1.5">Then $80 a month per pharmacy. Cancel any time.</p>
<div><label for="a-ph">Pharmacy name</label><input id="a-ph" type="text"></div>
<div><label for="a-st">State</label><select id="a-st"><option>Choose a state</option></select></div>
<div><label for="a-nm">Your full name</label><input id="a-nm" type="text"></div>
<div><label for="a-em">Work email</label><input id="a-em" type="email"></div>
<div><label for="a-pw">Password</label><input id="a-pw" type="password"></div>
<label style="display: flex; gap: 10px; align-items: flex-start; font-weight: 400; margin: 0"><input type="checkbox" style="width: 20px; height: 20px; margin: 0"><span>I agree to the <a href="#">terms</a> and <a href="#">privacy policy</a>.</span></label>
<a class="btn" href="inventory.html" style="width: 100%">Create account</a>
<p style="margin: 0; font-size: 14px; color: #555; text-align: center">You will land on your inventory, ready to add stock or import a CSV.</p>
</form>
</main>
</div>
</body>
</html>
